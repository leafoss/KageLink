name: Temporary KageLink 3.5.1 alignment

on:
  push:
    branches: [fix/3.5.1-dojo-reliability]
    paths: [".github/workflows/_temp_kagelink_351_alignment.yml"]

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.5.1-dojo-reliability
          fetch-depth: 0
      - name: Align release contract and remove this workflow
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, *, required=True):
              file = Path(path)
              text = file.read_text(encoding="utf-8-sig")
              if old not in text:
                  if required:
                      raise SystemExit(f"missing expected text in {path}: {old!r}")
                  return
              file.write_text(text.replace(old, new), encoding="utf-8")

          Path("RELEASE_VERSION").write_text("3.5.1\n", encoding="utf-8")
          replace("KageLink Installer/pubspec.yaml", "version: 3.5.0+23", "version: 3.5.1+24")
          replace("KageLink Installer/pc_agent/unified_app.py", 'APP_VERSION = "3.5.0"', 'APP_VERSION = "3.5.1"')
          replace("KageLink Installer/installer/KageLink_PC_Agent.iss", "3.5.0", "3.5.1")
          replace("KageLink Installer/COMPILAR_APK.bat", "3.5.0", "3.5.1")
          replace("KageLink Installer/installer/CRIAR_INSTALADOR.bat", "3.5.0", "3.5.1")
          replace(".github/workflows/leafos-memory-reviewer.yml", "3.5.0", "3.5.1")
          replace(".github/workflows/kage-pilot-v03.yml", "3.5.0", "3.5.1", required=False)
          replace(".github/workflows/release.yml", "3.5.0", "3.5.1", required=False)
          replace(
              "KageLink Installer/pc_agent/tests/test_release_version_v35.py",
              "def test_canonical_release_version_is_350(self):\n        self.assertEqual(self.expected, \"3.5.0\")",
              "def test_canonical_release_version_is_351(self):\n        self.assertEqual(self.expected, \"3.5.1\")",
          )
          replace(
              "KageLink Installer/pc_agent/unified_dojo_ui_v351.py",
              "cards = list(reversed(image_grid.winfo_children()))",
              "cards = list(image_grid.winfo_children())",
          )
          workflow = Path(".github/workflows/_temp_kagelink_351_alignment.yml")
          workflow.unlink()
      - name: Commit aligned 3.5.1 sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): align KageLink 3.5.1 artifacts and UI order"
          git push origin HEAD:fix/3.5.1-dojo-reliability
