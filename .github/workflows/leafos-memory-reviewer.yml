name: KageLink Unified LeafOS CI

on:
  pull_request:
    paths:
      - "KageLink Installer/pc_agent/**"
      - "KageLink Installer/installer/**"
      - "KageLink Installer/lib/**"
      - "KageLink Installer/test/**"
      - "KageLink Installer/pubspec.yaml"
      - "KageLink Installer/pubspec.lock"
      - "LEAFOS_MEMORY_REVIEWER.md"
      - "LEAFOS_DESKTOP.md"
      - "LEAFOS_DESKTOP.en.md"
      - "KAGELINK_3_5_DOJO.md"
      - "KAGELINK_3_5_DOJO.en.md"
      - "KAGELINK_3_5_1_DOJO_RELIABILITY.md"
      - "KAGELINK_3_5_1_DOJO_RELIABILITY.en.md"
      - "AGENTS_DOJO.md"
      - "AGENTS_DOJO.en.md"
      - "RELEASE_VERSION"
      - "DOWNLOAD.md"
      - "README.md"
      - "README.pt-BR.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/leafos-memory-reviewer.yml"

jobs:
  pc-agent-python:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: "KageLink Installer/pc_agent"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "KageLink Installer/pc_agent/requirements.txt"
      - name: Install PC Agent dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full Python suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall .

  pc-agent-package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: "KageLink Installer"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "KageLink Installer/pc_agent/requirements.txt"
      - name: Install package dependencies
        run: python -m pip install -r pc_agent/requirements.txt "pyinstaller>=6.10,<7"
      - name: Build unified KageLink.exe
        run: pyinstaller --noconfirm --clean --workpath build/KageLink installer/KageLink.spec
      - name: Build isolated Dojo loop helper
        run: pyinstaller --noconfirm --clean --workpath build/KagePilotDojo installer/KagePilotDojo.spec
      - name: Build isolated Dojo round helper
        run: pyinstaller --noconfirm --clean --workpath build/KagePilotRound installer/KagePilotRound.spec
      - name: Verify packaged executables
        shell: pwsh
        run: |
          $files = @(
            "dist\KageLink.exe",
            "dist\KagePilotDojo.exe",
            "dist\KagePilotRound.exe"
          )
          foreach ($path in $files) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "$path was not created"
            }
            $item = Get-Item -LiteralPath $path
            if ($item.Length -lt 1MB) {
              throw "$path is unexpectedly small"
            }
            Write-Host ("{0}: {1:N2} MB" -f $path, ($item.Length / 1MB))
          }
      - name: Smoke-test packaged Dojo helpers
        shell: pwsh
        run: |
          & ".\dist\KagePilotDojo.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "KagePilotDojo.exe --help failed" }
          & ".\dist\KagePilotRound.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "KagePilotRound.exe --help failed" }
      - name: Smoke-launch unified desktop
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist\KageLink.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) {
            throw "KageLink.exe exited during the startup smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "KageLink.exe remained alive through first-run UI startup."
      - name: Prepare final installer inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "installer\build_output" -Force | Out-Null
          Copy-Item -LiteralPath "dist\KageLink.exe" -Destination "installer\build_output\KageLink.exe" -Force
          Copy-Item -LiteralPath "dist\KagePilotDojo.exe" -Destination "installer\build_output\KagePilotDojo.exe" -Force
          Copy-Item -LiteralPath "dist\KagePilotRound.exe" -Destination "installer\build_output\KagePilotRound.exe" -Force
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "installer\tools\prepare_cloudflared.ps1"
          if ($LASTEXITCODE -ne 0) { throw "prepare_cloudflared.ps1 failed" }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $known = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $known) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Could not install Inno Setup" }
          }
      - name: Build final Windows Setup
        shell: pwsh
        run: |
          $iscc = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found" }
          & $iscc "installer\KageLink_PC_Agent.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $setup = "installer\output\KageLink-PC-Agent-Setup-v3.5.1.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "Final Setup was not created" }
          $item = Get-Item -LiteralPath $setup
          if ($item.Length -lt 1MB) { throw "Final Setup is unexpectedly small" }
          Write-Host ("Final Setup: {0:N2} MB" -f ($item.Length / 1MB))
      - uses: actions/upload-artifact@v4
        with:
          name: KageLink-3.5.1-Windows-preview
          path: |
            KageLink Installer/dist/KageLink.exe
            KageLink Installer/dist/KagePilotDojo.exe
            KageLink Installer/dist/KagePilotRound.exe
            KageLink Installer/installer/output/KageLink-PC-Agent-Setup-v3.5.1.exe
          if-no-files-found: error

  flutter-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "KageLink Installer"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Generate bilingual localizations
        run: flutter gen-l10n
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter tests
        run: flutter test
      - name: Create Android build workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _ci_android_build
          flutter create --platforms=android --org com.kagelink --project-name kagelink _ci_android_build
          rm -rf _ci_android_build/lib _ci_android_build/test
          cp -R lib _ci_android_build/lib
          cp -R assets _ci_android_build/assets
          if [ -d test ]; then cp -R test _ci_android_build/test; fi
          cp pubspec.yaml _ci_android_build/pubspec.yaml
          cp analysis_options.yaml _ci_android_build/analysis_options.yaml
          cp l10n.yaml _ci_android_build/l10n.yaml
          if [ -d android_overlay/app/src ]; then
            cp -R android_overlay/app/src/. _ci_android_build/android/app/src/
          fi
          cat > _ci_android_build/android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Xms512m -XX:MaxMetaspaceSize=512m -XX:-UseParallelGC -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          kotlin.incremental=false
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
      - name: Build Android release APK
        working-directory: "KageLink Installer/_ci_android_build"
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: KageLink-3.5.1-Android-preview
          path: KageLink Installer/_ci_android_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
