name: Apply Download UX

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/scripts/apply_download_ux.py"
      - ".github/workflows/apply-download-ux.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply download section to both READMEs
        run: python .github/scripts/apply_download_ux.py
      - name: Validate diff
        run: git diff --check
      - name: Commit README UX update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md README.pt-BR.md; then
            echo "README download UX is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.pt-BR.md
          git commit -m "Expose direct KageLink downloads in README"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
