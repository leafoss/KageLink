name: Kage Pilot sync main

on:
  push:
    branches:
      - agent/kage-pilot-v0.3
    paths:
      - .github/workflows/kage-pilot-sync-main.yml

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kage Pilot v0.3
        uses: actions/checkout@v4
        with:
          ref: agent/kage-pilot-v0.3
          fetch-depth: 0

      - name: Merge current main with reviewed conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff -X ours origin/main -m "Merge current main into Kage Pilot v0.3 before final integration"
          git push origin HEAD:agent/kage-pilot-v0.3
