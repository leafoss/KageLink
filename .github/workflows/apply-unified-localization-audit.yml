name: Apply Unified Localization Audit

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/scripts/fix_unified_localization_audit.py"
      - ".github/workflows/apply-unified-localization-audit.yml"

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-leafos-desktop
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "KageLink Installer/pc_agent/requirements.txt"
      - name: Apply localization audit fixes
        run: python .github/scripts/fix_unified_localization_audit.py
      - name: Install PC Agent dependencies
        working-directory: "KageLink Installer/pc_agent"
        run: python -m pip install -r requirements.txt
      - name: Focused localization contract
        working-directory: "KageLink Installer/pc_agent"
        run: python -m unittest discover -s tests -p "test_unified_localization_contract.py" -v
      - name: Unified shutdown/restart regression
        working-directory: "KageLink Installer/pc_agent"
        run: python -m unittest discover -s tests -p "test_unified_launcher_shutdown.py" -v
      - name: Full Python regression
        working-directory: "KageLink Installer/pc_agent"
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        working-directory: "KageLink Installer/pc_agent"
        run: python -m compileall .
      - name: Diff check
        run: git diff --check
      - name: Commit validated localization cleanup
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "KageLink Installer/pc_agent/unified_launcher.py" "KageLink Installer/pc_agent/unified_entry.py" "KageLink Installer/pc_agent/tests/test_unified_localization_contract.py"
          if (git diff --cached --quiet) {
            Write-Host "No source changes to commit."
            exit 0
          }
          git commit -m "Complete unified desktop localization audit"
          git push origin HEAD:feat/unified-leafos-desktop
