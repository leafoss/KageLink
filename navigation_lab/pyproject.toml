[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kage-navigation-lab"
version = "0.2.0"
description = "Independent mapping, localization, planning and navigation laboratory for Kage Agent PR 24"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
observer = [
  "numpy>=2.0,<3",
  "opencv-python>=4.10,<5",
  "Pillow>=10,<13",
  "mss>=9,<11",
]
dev = ["mypy>=1.10", "ruff>=0.5", "coverage>=7.5"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
